name: Revisão de PR (Claude)

# Review automático com IA a cada PR pra main: aponta falhas de segurança, bugs e
# código mal feito, comentando direto no PR (resumo + comentários inline).
# Requer o secret ANTHROPIC_API_KEY (ver docs/ci-revisao-pr.md).
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: revisao-claude-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  revisao:
    name: Claude revisa o PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Revisão com Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Comentário único que se atualiza a cada push (não polui o PR).
          use_sticky_comment: true
          claude_args: |
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            Você é um revisor de código sênior do projeto **Deep Scales** (PWA de escalas de
            louvor · backend Node/Express/TypeScript + Postgres via `pg` sem ORM · frontend
            React Native/Expo). Revise ESTE pull request e **responda em português**.

            REPO: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }}

            A branch do PR já está no diretório atual. Use `gh pr diff` pra ver o diff e
            `Read`/`Grep` pra abrir arquivos de contexto quando precisar confirmar algo.

            ## O que checar (foco, nesta ordem)

            1. **Segurança — multi-tenant / isolamento por organização (CRÍTICO):**
               - Toda query nova de dados deve rodar escopada por org. NÃO pode usar
                 `unscopedQuery`/`withBypass` (bypass do RLS) fora dos casos legítimos já
                 existentes (login por email, buscar org por código, unicidade de código,
                 criar org). Se um PR novo usar bypass, questione com força.
               - Rotas novas com dados devem ter `authMiddleware` e, quando for ação de
                 gestão/admin, `autoriza('capacidade')`. Aponte rota sem proteção.
               - Recurso PRO deve usar `requerRecurso('chave')` (não checar plano na mão).
            2. **Segurança geral:** segredos/tokens/credenciais commitados (inclusive `.env`
               — só `.env.example` pode ir), SQL montado por concatenação (deve ser query
               parametrizada `$1`), validação de entrada, autorização/ownership (IDOR),
               dependências arriscadas.
            3. **Bugs e erros de lógica:** casos de borda, `await` faltando, promessas não
               tratadas, off-by-one, estados de erro, tipos frouxos (`any`).
            4. **Qualidade / código mal feito:** duplicação, nomes ruins, funções gigantes,
               código morto, inconsistência com o padrão do arquivo/vizinhança, faltou teste
               onde havia teste antes.

            ## Como reportar
            - Poste os problemas específicos como **comentários inline** no código
              (`mcp__github_inline_comment__create_inline_comment` com `confirmed: true`).
            - Poste **um comentário de resumo** no PR (via `gh pr comment`) começando com um
              veredito bem visível numa das três formas:
              - `## ✅ Aprovado — sem problemas relevantes`
              - `## ⚠️ Ajustes recomendados` (liste o que ajustar, por prioridade)
              - `## ❌ Problemas graves (segurança/bug)` (liste primeiro os críticos)
            - No resumo, seja objetivo: bullets curtos, cada um com arquivo:linha e a
              sugestão de correção. Se estiver tudo certo, diga isso claramente — não invente
              problema. Comente só via GitHub (não deixe o feedback só no chat da action).
